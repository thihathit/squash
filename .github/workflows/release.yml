name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
      ref:
        description: "Branch or SHA to build from"
        required: true
        default: "main"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_dep: |
              sudo apt-get update
              sudo apt-get install -y file pkg-config libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install OS dependencies
        if: ${{ matrix.os_dep != '' }}
        run: ${{ matrix.os_dep }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version
        id: version
        shell: bash
        run: echo "stripped=${VERSION_TAG#v}" >> $GITHUB_OUTPUT
        env:
          VERSION_TAG: ${{ github.event.inputs.version }}

      - name: Update version
        shell: bash
        run: |
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Packager.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Packager.toml
          fi
        env:
          VERSION: ${{ steps.version.outputs.stripped }}

      - name: Build & Package
        run: cargo packager --release

      - name: "Zip .app bundle"
        if: ${{ matrix.os == 'macos-latest' }}
        run: ditto -c -k --sequesterRsrc target/release/Squash.app target/release/Squash.app.zip

      - name: "Upload: .app.zip"
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: Squash.app.zip
          path: target/release/Squash.app.zip

      - name: "Upload: aarch64.dmg"
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: Squash${{ steps.version.outputs.stripped }}_aarch64.dmg
          path: target/release/Squash_${{ steps.version.outputs.stripped }}_aarch64.dmg

      - name: "Upload: x64-setup.exe"
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: squash_${{ steps.version.outputs.stripped }}_x64-setup.exe
          path: target/release/squash_${{ steps.version.outputs.stripped }}_x64-setup.exe

      - name: "Upload: amd64.deb"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: squash_${{ steps.version.outputs.stripped }}_amd64.deb
          path: target/release/squash_${{ steps.version.outputs.stripped }}_amd64.deb

      - name: "Upload: .AppImage"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: squash_${{ steps.version.outputs.stripped }}_x86_64.AppImage
          path: target/release/squash_${{ steps.version.outputs.stripped }}_x86_64.AppImage

      - name: "Upload: x86_64.tar.gz"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: squash_${{ steps.version.outputs.stripped }}_x86_64.tar.gz
          path: target/release/squash_${{ steps.version.outputs.stripped }}_x86_64.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag and push
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.event.inputs.version }} --title "${{ github.event.inputs.version }}"

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*/*
          tag: ${{ github.event.inputs.version }}
          overwrite: true
          file_glob: true
