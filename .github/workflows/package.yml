name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0-test.5)"
        required: true

      ref:
        description: "Branch or SHA to build from"
        required: true
        default: "main"

permissions:
  contents: write

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            prefix: linux-x86_64

            os_dep: |
              sudo apt-get update

              sudo apt-get install -y \
                pkg-config \
                libfontconfig1-dev \
                libxcb-shape0-dev \
                libxcb-xfixes0-dev \
                libxkbcommon-dev \
                libxkbcommon-x11-dev

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            prefix: windows-x86_64
            os_dep: ""

          - os: macos-latest
            target: aarch64-apple-darwin
            prefix: macos-aarch64
            os_dep: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Configure cargo to use system git
        shell: bash
        run: |
          mkdir -p ~/.cargo

          cat >> ~/.cargo/config.toml <<EOF
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rewrite Cargo.toml version locally
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${VERSION#v}"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]

          cargo = Path("Cargo.toml")
          text = cargo.read_text()

          text = re.sub(
              r'^version = ".*?"$',
              f'version = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )

          cargo.write_text(text)
          PY

      - name: Local release commit (not pushed)
        shell: bash
        run: |
          git add Cargo.toml

          git commit \
            -m "release: ${{ github.event.inputs.version }}" \
            || true

      - name: Install OS dependencies
        if: ${{ matrix.os_dep != '' }}
        shell: bash
        run: ${{ matrix.os_dep }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git

          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: Build distributables
        shell: bash
        run: |
          dist build \
            --tag="${{ github.event.inputs.version }}" \
            --output-format=json \
            > dist-manifest.json

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p release-assets

          for f in target/distrib/*; do
            [ -f "$f" ] || continue

            base="$(basename "$f")"

            cp "$f" \
              "release-assets/${{ matrix.prefix }}-$base"
          done

      - name: Upload staged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.prefix }}
          path: release-assets/*

  release:
    needs:
      - build

    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Configure git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        shell: bash
        run: |
          git tag "${{ github.event.inputs.version }}"

          git push \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
            "${{ github.event.inputs.version }}"

      - name: Create GitHub release
        shell: bash
        run: |
          gh release create \
            "${{ github.event.inputs.version }}" \
            --title "${{ github.event.inputs.version }}" \
            --generate-notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*
          tag: ${{ github.event.inputs.version }}
          overwrite: true
          file_glob: true
